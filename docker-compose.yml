services:
  postgres:
    image: postgres:16-alpine
    container_name: jobportal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jobportal_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-jobportal_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - jobportal-network

  jobportal-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jobportal-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:5000
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-jobportal_db};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}"
      Jwt__Issuer: ${Jwt__Issuer:-JobPortalAPI}
      Jwt__Audience: ${Jwt__Audience:-JobPortalClients}
      Jwt__SecretKey: ${Jwt__SecretKey:-DevelopmentSuperSecretKeyForJobPortalAPIMustBeAtLeast32BytesLong!}
      Jwt__AccessTokenExpirationMinutes: ${Jwt__AccessTokenExpirationMinutes:-15}
      Jwt__RefreshTokenExpirationDays: ${Jwt__RefreshTokenExpirationDays:-7}
      Application__Name: "JobPortal API"
      Application__Version: "1.0.0"
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - jobportal-network

volumes:
  postgres_data:
    driver: local

networks:
  jobportal-network:
    driver: bridge
